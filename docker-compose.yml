services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend

    ports:
      - "8080:8080"

    volumes:
      - ./backend/database:/app/database
      - ./backend/uploads:/app/uploads

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend

    ports:
      - "3000:3000"

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080

    depends_on:
      - backend

    restart: unless-stopped
